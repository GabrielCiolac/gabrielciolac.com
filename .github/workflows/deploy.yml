name: build-and-publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/gabrielciolac/gabrielciolac.com

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tell the NAS to redeploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SECRET: ${{ secrets.DEPLOY_HOOK_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then echo "DEPLOY_HOOK_SECRET not set; the hourly cron will pick it up"; exit 0; fi
          ts=$(date +%s)
          body="{\"sha\":\"${GITHUB_SHA}\"}"
          sig=$(printf '%s.%s' "$ts" "$body" | openssl dgst -sha256 -hmac "$SECRET" -hex | sed 's/^.* //')
          # The first deploy after this change runs the old nginx, which has no /__deploy route yet.
          curl -sS --fail-with-body --max-time 20 -X POST https://gabrielciolac.com/__deploy \
            -H "Content-Type: application/json" -H "X-Deploy-Timestamp: $ts" -H "X-Deploy-Signature: sha256=$sig" \
            --data "$body" || echo "::warning::deploy hook failed; the hourly cron will redeploy"
