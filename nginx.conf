server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Redirect www to apex (behind NPM, so trust X-Forwarded-Proto)
    if ($host = www.gabrielciolac.com) {
        return 301 https://gabrielciolac.com$request_uri;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # CI deploy webhook -> listener on the NAS host (/root/bin/deploy-hook.py).
    # "deploy-hook" is mapped by the TrueNAS app's extra_hosts, so no address lives here.
    # Requests are HMAC-signed; the listener rejects anything unsigned or stale.
    location = /__deploy {
        limit_except POST { deny all; }
        client_max_body_size 1k;
        proxy_pass http://deploy-hook:30089/hook;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # Guestbook API -> PocketBase on the NAS ("pocketbase" is mapped by the TrueNAS app's extra_hosts).
    # Only what the page needs is passed through: list/create entries, and read their drawings.
    # The dashboard and everything else stays off this domain.
    location = /api/collections/guestbook/records {
        limit_except GET POST { deny all; }
        client_max_body_size 600k;
        proxy_pass http://pocketbase:30090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store" always;
    }
    location ^~ /api/files/guestbook/ {
        limit_except GET { deny all; }
        proxy_pass http://pocketbase:30090;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        add_header X-Content-Type-Options nosniff always;
    }
    # Thinking Outside My Room (the blog): read-only posts, their pictures, and the RSS feed.
    location = /api/collections/posts/records {
        limit_except GET { deny all; }
        proxy_pass http://pocketbase:30090;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        add_header Cache-Control "no-cache" always;
    }
    location ^~ /api/files/posts/ {
        limit_except GET { deny all; }
        proxy_pass http://pocketbase:30090;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /feed.xml {
        limit_except GET { deny all; }
        proxy_pass http://pocketbase:30090/api/courier/feed.xml;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
    }
    location ^~ /api/ { return 404; }

    # Scripts change with the page, so always revalidate them; images can be cached.
    location ~* ^/room/.+\.js$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Hourly weather written by the NAS cron (bind-mounted read-only).
    location /data/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /room/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
