<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gabriel Ciolac</title>
  <meta name="description" content="Gabriel Ciolac">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👋</text></svg>">
  <style>
    :root {
      --bg: #faf9f7;
      --fg: #1c1b19;
      --muted: #6b6862;
      --accent: #c2410c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141311;
        --fg: #ecebe8;
        --muted: #9a968f;
        --accent: #fb923c;
      }
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font: 18px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main { max-width: 36rem; }
    h1 {
      font-size: clamp(2.25rem, 7vw, 3.5rem);
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
    }
    h1 span { color: var(--accent); }
    p { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Hi, I'm <span>Gabriel</span>.</h1>
    <p>Welcome to gabrielciolac.com. Something is being built here — check back soon.</p>
    <p style="margin-top:2rem;font-size:.8rem">Deployed from GitHub.</p>
  </main>
</body>
</html>
